name: Publicar site e buscar notícias

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # todo dia às 8h (horário de Recife)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  noticias:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Buscar notícias novas
        run: python scripts/buscar_noticias.py
      - name: Salvar notícias no repositório
        run: |
          git config user.name "robo-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/img/noticias
          git diff --cached --quiet || (git commit -m "Notícias automáticas de $(date +%d/%m/%Y)" && git push)

  build:
    needs: noticias
    if: always() && needs.noticias.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
