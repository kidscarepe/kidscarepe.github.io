# ==========================================================
# NOTÍCIAS AUTOMÁTICAS — SÓ PERNAMBUCO
# O robô roda 1x por dia e publica notícias novas que:
#   1) falem de um dos ASSUNTOS abaixo, E
#   2) citem um dos LOCAIS de Pernambuco abaixo (no título ou resumo).
# Cada notícia traz só título + resumo + foto + link para a matéria original.
# ==========================================================
ativo: true
max_por_dia: 3          # máximo de notícias automáticas publicadas por dia
dias_max: 7             # ignora notícias mais antigas que isso
categoria: Na mídia

palavras_chave:
  - autismo
  - autista
  - autistas
  - TEA
  - TDAH
  - neurodivergente
  - neurodivergentes
  - neurodesenvolvimento
  - desenvolvimento infantil
  - primeira infância
  - inclusão escolar
  - educação inclusiva
  - síndrome de down
  - deficiência intelectual
  - fonoaudiologia
  - terapia ocupacional
  - ABA
  - pediatria
  - saúde infantil

locais:
  - Pernambuco
  - pernambucano
  - pernambucana
  - pernambucanos
  - Recife
  - recifense
  - Olinda
  - Jaboatão
  - Paulista
  - Camaragibe
  - Cabo de Santo Agostinho
  - São Lourenço da Mata
  - Abreu e Lima
  - Igarassu
  - Ipojuca
  - Goiana
  - Moreno
  - Vitória de Santo Antão
  - Caruaru
  - Garanhuns
  - Gravatá
  - Petrolina
  - Serra Talhada
  - Arcoverde
  - Santa Cruz do Capibaribe
  - Alepe
  - Boa Viagem

fontes:
  - nome: Google Notícias — autismo e TDAH em PE
    url: "https://news.google.com/rss/search?q=(autismo+OR+autista+OR+TEA+OR+TDAH+OR+neurodivergente)+(Pernambuco+OR+Recife+OR+Olinda+OR+Jaboat%C3%A3o+OR+Caruaru+OR+Petrolina)+when:7d&hl=pt-BR&gl=BR&ceid=BR:pt-419"
    filtrar: false       # a busca já filtra o assunto
  - nome: Google Notícias — infância em PE
    url: "https://news.google.com/rss/search?q=(%22desenvolvimento+infantil%22+OR+%22primeira+inf%C3%A2ncia%22+OR+%22inclus%C3%A3o+escolar%22+OR+%22educa%C3%A7%C3%A3o+inclusiva%22)+(Pernambuco+OR+Recife+OR+Olinda+OR+Jaboat%C3%A3o)+when:7d&hl=pt-BR&gl=BR&ceid=BR:pt-419"
    filtrar: false       # a busca já filtra o assunto
