---
layout: default
title: Categorias
permalink: /categorias/
---
<section class="container secao">
  <h1 class="titulo-pagina">Categorias</h1>
  {% assign cats = site.categories | sort %}
  {% for cat in cats %}
  <div id="{{ cat[0] | slugify: "latin" }}" class="bloco-cat">
    <h2 class="titulo-secao">{{ cat[0] }} <small>{{ cat[1].size }}</small></h2>
    <div class="grade">{% for post in cat[1] %}{% include card.html post=post %}{% endfor %}</div>
  </div>
  {% endfor %}
</section>
